apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: my-fanout
  namespace: rabbit-ns
spec:
  name: fanout-exchange # name of the exchange
  type: fanout # default to 'direct' if not provided; can be set to 'direct', 'fanout', 'headers', and 'topic'
  autoDelete: false
  durable: true
  rabbitmqClusterReference:
    name: triple-rabbit
    namespace: rabbit-ns